<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Gennadiy Strelkov"/><meta name="description" content=""/><meta name="keywords" content=""/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="index.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img id="header-logo" alt="Spot logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button class="profile__avatar-btn"><img id="profile-avatar-edit-icon" class="profile__avatar-edit-icon"/>Edit Avatar</button> <img id="profile-avatar" alt="Bessie Coleman" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img id="edit-profile-icon" alt="Pencil icon"/>Edit Profile</button></div><button type="button" class="profile__add-btn"><img id="add-card-icon" alt="Plus icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-btn"><img src="" alt=""/></button> <img src="" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer page__section"><div class="footer__copyright">&copy; 2025 Gennadiy Strelkov</div></footer><div class="modal" id="edit-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img class="modal__close-image" id="edit-modal-close-icon" alt="Close icon"/></button><h2 class="modal__title">Edit profile</h2><form name="edit-profile" id="edit-profile-form" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="add-card-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img class="modal__close-image" id="add-card-modal-close-icon" alt="Close icon"/></button><h2 class="modal__title">New post</h2><form name="edit-profile" id="add-card-form" class="modal__form" novalidate><label for="add-card-link-input" class="modal__label">Image link <input id="add-card-link-input" name="link" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="add-card-link-input-error" class="modal__error"></span></label> <label for="add-card-name-input" class="modal__label">Caption <input id="add-card-name-input" name="name" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="add-card-name-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div></div><div class="modal" id="preview-modal"><div class="modal__content modal__content_type_preview"><button class="modal__close-btn modal__close-btn_type_preview" type="button"></button> <img src="" alt="" class="modal__image"/><p class="modal__caption"></p></div></div><div class="modal" id="avatar-modal"><div class="modal__container"><button aria-label="Close modal" type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit Profile Avatar</h2><form name="edit-avatar" id="edit-avatar-form" class="modal__form" novalidate><label for="profile-avatar-input" class="modal__label">Avatar <input id="profile-avatar-input" name="avatar" class="modal__input" placeholder="Paste the link to an image" required/> <span id="profile-avatar-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container" id="delete-modal-container"><button aria-label="Close modal" type="button" class="modal__close-btn" id="delete-modal-close-btn"></button><h2 class="modal__title" id="delete-modal-title">Are you sure you want to delete this image?</h2><form id="delete-form" class="modal__form"><div class="modal__button-container" id="modal-button-container"><button type="submit" class="modal__submit-btn" id="modal-delete-btn">Delete</button> <button type="button" class="modal__submit-btn" id="delete-cancel-btn">Cancel</button></div></form></div></div></body></html>
